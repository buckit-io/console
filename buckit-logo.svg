<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Bucket icon -->
  <g transform="translate(2, 5)">
    <!-- Handle arc -->
    <path d="M16 20 Q16 4, 28 4 Q40 4, 40 20"
          fill="none" stroke="#312E81" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Handle grip -->
    <rect x="24.5" y="2.5" width="7" height="4.5" rx="1.8" fill="#818CF8" stroke="#312E81" stroke-width="1.5"/>

    <!-- Bucket body -->
    <path d="M11 22 L14.5 52 Q15 54 17.5 54 L38.5 54 Q41 54 41.5 52 L45 22Z"
          fill="url(#bodyGrad)" stroke="#312E81" stroke-width="2"/>

    <!-- Rim - full ellipse (back) -->
    <ellipse cx="28" cy="22" rx="18" ry="5.5" fill="#6366F1" stroke="#312E81" stroke-width="2"/>

    <!-- Rim - top half (lighter, inside) -->
    <path d="M10 22 Q10 16.5, 28 16.5 Q46 16.5, 46 22"
          fill="#A5B4FC" stroke="#312E81" stroke-width="2"/>
  </g>

  <!-- "buckit" wordmark -->
  <text x="58" y="55" font-family="'Nunito', 'Varela Round', 'Quicksand', 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="800" fill="#1E1B4B" letter-spacing="1">buckit</text>
</svg>
