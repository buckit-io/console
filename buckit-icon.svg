  <!-- Bucket body -->
  <path d="M13 24 L17 55 Q17.5 58 20 58 L44 58 Q46.5 58 47 55 L51 24Z"
        fill="url(#bodyGrad)"/>

  <!-- Rim - back ellipse (darker) -->
  <ellipse cx="32" cy="24" rx="20" ry="6" fill="#4F46E5"/>

  <!-- Rim - front half (lighter, showing inside depth) -->
